name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fma
          POSTGRES_PASSWORD: fma_pass
          POSTGRES_DB: fma_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://fma:fma_pass@localhost:5432/fma_db
      SECRET_KEY: ci-secret-key-not-for-production
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MLFLOW_TRACKING_URI: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short
