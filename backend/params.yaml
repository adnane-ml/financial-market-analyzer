tickers:
  - SPY
  - AAPL
  - MSFT
  - GOOGL
  - NVDA

period: 5y

features:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  sma_short: 20
  sma_long: 50
  volatility_windows: [5, 20]

train:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_splits: 5
